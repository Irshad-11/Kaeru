<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaeru • Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .dashboard-container {
            max-width: 1280px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px -10px rgb(0 0 0 / 0.1);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        
        .tab-active {
            background-color: #f8fafc;
            border-bottom: 3px solid #111827;
            font-weight: 600;
        }
        
        .timeline-line {
            position: relative;
        }
        
        .timeline-line::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e5e7eb;
        }
        
        .modal {
            animation: modalPop 0.2s ease forwards;
        }
        
        @keyframes modalPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .task-item:hover .action-icons,
        .subtask-item:hover .subtask-actions {
            opacity: 1;
        }
        
        .progress-ring {
            transition: stroke-dashoffset 0.35s;
        }
        
        .metadata {
            font-size: 10px;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
    <div class="dashboard-container mx-auto h-[calc(100vh-4rem)] flex flex-col">
        <!-- HEADER -->
        <div class="px-8 py-5 border-b flex items-center justify-between bg-white">
            <div id="header-date" class="text-3xl font-semibold text-gray-900"></div>
            
            <div class="flex border border-gray-200 rounded-2xl overflow-hidden">
                <a href="/tasks" class="tab px-8 py-3 text-sm font-medium flex items-center gap-x-2 transition-colors {{ 'tab-active' if tab == 'tasks' else '' }}">
                    <i class="fa-solid fa-list-check"></i> Tasks
                </a>
                <a href="/notes" class="tab px-8 py-3 text-sm font-medium flex items-center gap-x-2 transition-colors {{ 'tab-active' if tab == 'notes' else '' }}">
                    <i class="fa-solid fa-note-sticky"></i> Notes
                </a>
                <a href="/timeless" class="tab px-8 py-3 text-sm font-medium flex items-center gap-x-2 transition-colors {{ 'tab-active' if tab == 'timeless' else '' }}">
                    <i class="fa-solid fa-infinity"></i> Timeless
                </a>
            </div>
            
            <div class="flex items-center gap-x-4">
                <button onclick="showTaskHistory()" class="flex items-center gap-x-2 text-gray-500 hover:text-gray-700 text-sm font-medium">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Task History</span>
                </button>
                <div class="w-9 h-9 bg-gray-100 rounded-2xl flex items-center justify-center cursor-pointer hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-user text-gray-600"></i>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex overflow-hidden" id="main-content">
            {% if tab == 'tasks' %}
            <div class="flex flex-1 overflow-hidden">
                <!-- LEFT: Timeline -->
                <div class="flex-1 flex flex-col border-r overflow-hidden">
                    <div class="flex-1 overflow-y-auto p-6 space-y-8" id="timeline-container"></div>
                    
                    <div onclick="showAddTaskModal()" 
                         class="absolute bottom-8 left-8 w-12 h-12 bg-gray-900 hover:bg-black text-white rounded-3xl flex items-center justify-center shadow-lg cursor-pointer transition-all active:scale-95">
                        <i class="fa-solid fa-plus text-2xl"></i>
                    </div>
                </div>

                <!-- RIGHT: Progress -->
                <div class="flex-1 flex flex-col overflow-hidden">
                    <div class="px-6 py-4 border-b flex items-center justify-between bg-white">
                        <h2 class="text-lg font-semibold text-gray-900">Progress</h2>
                        <button onclick="showAddProjectModal()" 
                                class="flex items-center justify-center w-8 h-8 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-2xl transition-colors">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-6 space-y-4" id="progress-container">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>


<!-- ========================================================== -->

<div class="flex flex-1 overflow-hidden bg-white" id="notes-app">

    <!-- ADD TASK MODAL -->
    <div onclick="if(event.target.id === 'task-modal')hideTaskModal()" id="task-modal"
         class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" class="modal bg-white w-full max-w-md mx-4 rounded-3xl p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold">New Task</h3>
                <button onclick="hideTaskModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            <input id="task-input" type="text" placeholder="What needs to be done?" 
                   class="w-full px-5 py-4 text-lg border border-gray-200 focus:border-gray-400 rounded-2xl outline-none">
            <div class="flex justify-between text-xs text-gray-400 mt-2 px-1">
                <span>Press <span class="font-mono bg-gray-100 px-1.5 rounded">Enter</span> to save</span>
                <span>Esc to cancel</span>
            </div>
            <input type="date" id="task-due-date" class="mt-6 w-full px-5 py-3 text-sm border border-gray-200 rounded-2xl outline-none">
        </div>
    </div>

    <!-- ADD PROJECT MODAL -->
    <div onclick="if(event.target.id === 'project-modal')hideProjectModal()" id="project-modal"
         class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" class="modal bg-white w-full max-w-md mx-4 rounded-3xl p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold">New Project</h3>
                <button onclick="hideProjectModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            <input id="project-input" type="text" placeholder="Project name" 
                   class="w-full px-5 py-4 text-lg border border-gray-200 focus:border-gray-400 rounded-2xl outline-none">
            <button onclick="addNewProject()" 
                    class="mt-8 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-medium">
                Create Project
            </button>
        </div>

    <script>
        let currentTasks = [];
        let currentProjects = [];
        let todayDateStr = new Date().toISOString().split('T')[0];

        function formatHeaderDate() {
            const dateEl = document.getElementById('header-date');
            const date = new Date();
            const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
            dateEl.textContent = date.toLocaleDateString('en-US', options).replace(',', '');
        }

        async function loadTasks() {
            try {
                const res = await fetch('/api/tasks');
                currentTasks = await res.json();
                renderTimeline();
            } catch (e) {
                console.error('Failed to load tasks', e);
            }
        }

        async function loadProjects() {
            try {
                const res = await fetch('/api/projects');
                currentProjects = await res.json();
                renderProgress();
            } catch (e) {
                console.error('Failed to load projects', e);
            }
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            const todayTasks = currentTasks.filter(t => t.due_date === todayDateStr);
            const completedToday = todayTasks.filter(t => t.completed).length;
            const todayProgress = todayTasks.length ? Math.round((completedToday / todayTasks.length) * 100) : 0;

            let html = `
                <div>
                    <div class="flex items-baseline justify-between mb-4">
                        <div>
                            <span class="text-emerald-600 font-medium">Today,</span>
                            <span class="ml-2 text-gray-900 font-semibold">Task</span>
                        </div>
                        <div class="text-sm text-gray-500">
                            ${completedToday}/${todayTasks.length} <span class="font-medium">${todayProgress}% Done</span>
                        </div>
                    </div>
                    <div class="space-y-px" id="today-list">
            `;

            todayTasks.forEach(task => html += createTaskRow(task, true));
            html += '</div></div>';

            html += `
                <div class="mt-8">
                    <div class="text-gray-500 text-sm font-medium mb-4">Upcoming</div>
                    <div class="timeline-line pl-10 space-y-8" id="upcoming-list"></div>
                </div>
            `;

            container.innerHTML = html;

            const upcoming = currentTasks.filter(t => t.due_date && t.due_date > todayDateStr);
            const grouped = {};
            upcoming.forEach(task => {
                if (!grouped[task.due_date]) grouped[task.due_date] = [];
                grouped[task.due_date].push(task);
            });

            const sortedDates = Object.keys(grouped).sort();
            const upcomingContainer = document.getElementById('upcoming-list');

            sortedDates.forEach((date, index) => {
                const dateObj = new Date(date);
                const day = dateObj.getDate();
                const monthName = dateObj.toLocaleString('default', { month: 'short' });

                let groupHTML = `
                    <div class="relative">
                        <div class="absolute -left-[42px] flex flex-col items-center">
                            <div class="w-10 h-10 rounded-2xl border-2 border-gray-900 bg-white flex items-center justify-center text-sm font-semibold z-10">
                                ${day}
                            </div>
                            ${index < sortedDates.length - 1 ? `<div class="w-px h-8 bg-gray-300 mt-1"></div>` : ''}
                        </div>
                        <div class="text-xs uppercase font-medium text-gray-400 mb-2">${monthName}</div>
                        <div class="space-y-px">
                `;

                grouped[date].forEach(task => groupHTML += createTaskRow(task, false));
                groupHTML += '</div></div>';
                upcomingContainer.innerHTML += groupHTML;
            });

            if (sortedDates.length === 0) {
                upcomingContainer.innerHTML = `<div class="text-gray-400 text-sm italic pl-6">No upcoming tasks</div>`;
            }
        }

        function createTaskRow(task, isToday) {
            const checked = task.completed ? 'checked' : '';
            const strike = task.completed ? 'line-through text-gray-400' : '';
            return `
                <div class="task-item group flex items-center gap-x-3 px-4 py-3 rounded-2xl hover:bg-gray-50 transition-colors">
                    <input type="checkbox" ${checked} onclick="toggleTask(${task.id})" class="w-5 h-5 accent-gray-900 cursor-pointer">
                    <span onclick="editTaskInline(this, ${task.id})" class="flex-1 ${strike} cursor-text">${task.title}</span>
                    <div class="action-icons opacity-0 group-hover:opacity-100 flex items-center gap-x-1">
                        <button onclick="deleteTask(${task.id}); event.stopImmediatePropagation()" 
                                class="text-gray-400 hover:text-red-500 w-7 h-7 flex items-center justify-center">
                            <i class="fa-solid fa-trash text-sm"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderProgress() {
            const container = document.getElementById('progress-container');
            container.innerHTML = '';

            currentProjects.forEach(project => {
                const isOpen = project.isOpen || false;

                const createdDate = project.added_date ? new Date(project.added_date).toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '—';
                const updatedDate = project.last_updated ? new Date(project.last_updated).toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '—';

                let projectHTML = `
                    <div class="bg-white border border-gray-200 rounded-3xl overflow-hidden">
                        <div onclick="toggleProject(${project.id})" class="px-6 py-4 flex items-center justify-between cursor-pointer hover:bg-slate-50">
                            <div class="flex items-center gap-x-3">
                                <i onclick="event.stopImmediatePropagation(); toggleProject(${project.id})" 
                                   class="fa-solid ${isOpen ? 'fa-chevron-down' : 'fa-chevron-right'} text-gray-400"></i>
                                <span class="font-semibold text-gray-900">${project.title}</span>
                            </div>
                            
                            <div class="flex items-center gap-x-4">
                                <div class="text-xs text-gray-400">
                                    ${project.completed_count}/${project.total}
                                </div>
                                <div class="relative w-10 h-10 flex-shrink-0">
                                    <svg class="w-10 h-10 -rotate-90" viewBox="0 0 36 36">
                                        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#e5e7eb" stroke-width="3" />
                                        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#10b981" stroke-width="3" 
                                              stroke-dasharray="${project.progress}, 100" class="progress-ring" />
                                    </svg>
                                    <div class="absolute inset-0 flex items-center justify-center text-[10px] font-semibold text-gray-900">
                                        ${project.progress}%
                                    </div>
                                </div>
                                <button onclick="event.stopImmediatePropagation(); deleteProject(${project.id})" 
                                        class="text-red-400 hover:text-red-500 text-xs font-medium">delete</button>
                            </div>
                        </div>

                        <!-- Metadata -->
                        <div class="px-6 pb-2 metadata flex gap-4 text-[10px]">
                            <div>Created: ${createdDate}</div>
                            <div>Last updated: ${updatedDate}</div>
                        </div>
                `;

                if (isOpen) {
                    projectHTML += `<div class="px-6 pb-6 border-t">`;
                    project.subtasks.forEach(sub => {
                        const subChecked = sub.completed ? 'checked' : '';
                        const subStrike = sub.completed ? 'line-through text-gray-400' : '';
                        projectHTML += `
                            <div class="subtask-item group flex items-center gap-x-3 px-4 py-3 rounded-2xl hover:bg-gray-50 transition-colors">
                                <input type="checkbox" ${subChecked} onclick="toggleSubtask(${sub.id})" class="w-4 h-4 accent-gray-900 cursor-pointer">
                                <span onclick="editSubtaskInline(this, ${sub.id})" class="flex-1 text-sm ${subStrike} cursor-text">${sub.title}</span>
                                <div class="subtask-actions opacity-0 group-hover:opacity-100 flex items-center gap-x-1">
                                    <button onclick="deleteSubtask(${sub.id}); event.stopImmediatePropagation()" 
                                            class="text-gray-400 hover:text-red-500 w-6 h-6 flex items-center justify-center">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    projectHTML += `
                        <div onclick="addSubtaskPrompt(${project.id})" 
                             class="mt-3 flex items-center justify-center text-emerald-600 text-sm font-medium cursor-pointer hover:underline">
                            <i class="fa-solid fa-plus mr-1"></i> Add sub-task
                        </div>
                    </div>`;
                }

                projectHTML += `</div>`;
                container.innerHTML += projectHTML;
            });

            if (currentProjects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                        <p>No projects yet.<br>Click + to create one.</p>
                    </div>
                `;
            }
        }

        // ================== CRUD FUNCTIONS ==================

        async function toggleTask(id) {
            await fetch(`/api/tasks/${id}/toggle`, { method: 'POST' });
            await loadTasks();
        }

        async function deleteTask(id) {
            if (confirm('Delete this task?')) {
                await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                await loadTasks();
            }
        }

        function editTaskInline(el, id) { /* same as before */ 
            // ... (unchanged for brevity - keep your original logic)
            const originalText = el.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = originalText;
            input.className = 'flex-1 px-2 py-1 border border-gray-300 rounded-xl text-sm outline-none';
            el.replaceWith(input);
            input.focus();
            input.select();

            const save = async () => {
                if (input.value.trim() && input.value !== originalText) {
                    await fetch(`/api/tasks/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: input.value.trim() })
                    });
                    await loadTasks();
                } else {
                    input.replaceWith(el);
                }
            };

            input.addEventListener('blur', save);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') save();
                if (e.key === 'Escape') input.replaceWith(el);
            });
        }

        function toggleProject(id) {
            const project = currentProjects.find(p => p.id === id);
            if (project) {
                project.isOpen = !project.isOpen;
                renderProgress();   // Only re-render, no full reload
            }
        }

        async function toggleSubtask(id) {
            await fetch(`/api/subtasks/${id}/toggle`, { method: 'POST' });
            
            // IMPORTANT: Reload data but PRESERVE open/closed state
            await preserveAndReloadProjects();
        }

        async function deleteSubtask(sub_id) {
            if (confirm('Delete this subtask?')) {
                await fetch(`/api/subtasks/${sub_id}`, { method: 'DELETE' });
                await preserveAndReloadProjects();
            }
        }

        function editSubtaskInline(el, id) {
            const original = el.textContent;
            const input = document.createElement('input');
            input.value = original;
            input.className = 'flex-1 text-sm px-2 py-1 border border-gray-300 rounded-xl outline-none';
            el.replaceWith(input);
            input.focus();

            const save = async () => {
                if (input.value.trim() && input.value !== original) {
                    await fetch(`/api/subtasks/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: input.value.trim() })
                    });
                    await loadProjects();
                } else {
                    input.replaceWith(el);
                }
            };

            input.addEventListener('blur', save);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') save();
                if (e.key === 'Escape') input.replaceWith(el);
            });
        }

        // Modals (unchanged except minor improvements)
                function showAddTaskModal() {
            const modal = document.getElementById('task-modal');
            const input = document.getElementById('task-input');
            const dueInput = document.getElementById('task-due-date');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            input.focus();
            input.value = '';           // Clear previous input
            dueInput.value = todayDateStr;   // Default to today

            // Remove any previous listeners to prevent duplicates
            input.onkeydown = null;

            // Add fresh keydown listener for Enter / Escape
            input.onkeydown = async function(e) {
                if (e.key === 'Enter') {
                    const title = input.value.trim();
                    if (title) {
                        const due_date = dueInput.value || todayDateStr;
                        
                        try {
                            await fetch('/api/tasks', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ title, due_date })
                            });
                            
                            hideTaskModal();
                            await loadTasks();        // Refresh the task list
                        } catch (err) {
                            console.error("Failed to add task", err);
                            alert("Failed to save task. Please try again.");
                        }
                    }
                } 
                else if (e.key === 'Escape') {
                    hideTaskModal();
                }
            };
        }

        function hideTaskModal() {
            const modal = document.getElementById('task-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            const input = document.getElementById('task-input');
            input.value = '';
            input.onkeydown = null;   // Clean up listener
        }

        function showAddProjectModal() {
            const modal = document.getElementById('project-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('project-input').focus();
        }

        function hideProjectModal() {
            const modal = document.getElementById('project-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function addNewProject() {
            const title = document.getElementById('project-input').value.trim();
            if (title) {
                await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });
                hideProjectModal();
                await loadProjects();
            }
        }

        async function addSubtaskPrompt(projectId) {
        const title = prompt('New sub-task title:');
        if (title && title.trim()) {
            await fetch(`/api/projects/${projectId}/subtasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title.trim() })
            });
            await preserveAndReloadProjects();
        }
    }

        // Helper: Reload projects while keeping expanded/collapsed state
        async function preserveAndReloadProjects() {
            // Step 1: Remember which projects were open
            const openProjectIds = currentProjects
                .filter(p => p.isOpen)
                .map(p => p.id);

            // Step 2: Load fresh data from server
            const res = await fetch('/api/projects');
            currentProjects = await res.json();

            // Step 3: Restore open state for projects that were previously open
            currentProjects.forEach(project => {
                if (openProjectIds.includes(project.id)) {
                    project.isOpen = true;
                } else {
                    project.isOpen = false;   // optional: keep closed if it was closed
                }
            });

            // Step 4: Re-render
            renderProgress();
        }

        // Delete entire project
        async function deleteProject(id) {
            if (confirm('Delete this entire project and all its sub-tasks?')) {
                try {
                    await fetch(`/api/projects/${id}`, { 
                        method: 'DELETE' 
                    });
                    
                    // After deletion, reload projects (preserving open state of remaining projects)
                    await preserveAndReloadProjects();
                    
                } catch (e) {
                    console.error('Failed to delete project', e);
                    alert('Failed to delete project. Please try again.');
                }
            }
        }

        async function showTaskHistory() {
            try {
                // Fetch tasks from the last 30 days
                const res = await fetch('/api/tasks/history');
                const historyTasks = await res.json();

                let html = `
                    <div class="max-w-2xl w-full mx-4 bg-white rounded-3xl shadow-2xl overflow-hidden">
                        <!-- Modal Header -->
                        <div class="px-8 py-6 border-b flex items-center justify-between bg-gray-50">
                            <div>
                                <h3 class="text-2xl font-semibold text-gray-900">Task History</h3>
                                <p class="text-sm text-gray-500 mt-1">Past 30 days summary</p>
                            </div>
                            <button onclick="hideHistoryModal()" 
                                    class="text-gray-400 hover:text-gray-600 transition-colors">
                                <i class="fa-solid fa-xmark text-3xl"></i>
                            </button>
                        </div>
                        
                        <!-- Content -->
                        <div class="p-8 max-h-[70vh] overflow-y-auto">
                `;

                if (historyTasks.length === 0) {
                    html += `
                        <div class="text-center py-16 text-gray-400">
                            <i class="fa-solid fa-clock-rotate-left text-6xl mb-4"></i>
                            <p class="text-lg">No tasks completed in the past 30 days</p>
                        </div>
                    `;
                } else {
                    // Group by date
                    const grouped = {};
                    historyTasks.forEach(task => {
                        const date = task.completed_at ? task.completed_at.split('T')[0] : task.due_date;
                        if (!grouped[date]) grouped[date] = [];
                        grouped[date].push(task);
                    });

                    // Sort dates descending (newest first)
                    const sortedDates = Object.keys(grouped).sort().reverse();

                    sortedDates.forEach(date => {
                        const dateObj = new Date(date);
                        const displayDate = dateObj.toLocaleDateString('en-US', { 
                            weekday: 'long', 
                            month: 'long', 
                            day: 'numeric' 
                        });

                        html += `
                            <div class="mb-8">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></div>
                                    <span class="font-semibold text-gray-900">${displayDate}</span>
                                    <span class="text-xs text-gray-400 ml-auto">${grouped[date].length} tasks</span>
                                </div>
                                <div class="space-y-2 pl-6">
                        `;

                        grouped[date].forEach(task => {
                            html += `
                                <div class="flex items-center gap-3 bg-gray-50 px-5 py-3.5 rounded-2xl">
                                    <i class="fa-solid fa-check text-emerald-500"></i>
                                    <span class="flex-1 text-gray-700">${task.title}</span>
                                    <span class="text-xs text-gray-400 font-mono">${task.due_date || ''}</span>
                                </div>
                            `;
                        });

                        html += `</div></div>`;
                    });
                }

                html += `</div></div>`;

                // Create and show modal
                let modal = document.getElementById('history-modal');
                if (!modal) {
                    modal = document.createElement('div');
                    modal.id = 'history-modal';
                    modal.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-[100]';
                    document.body.appendChild(modal);
                }

                modal.innerHTML = html;
                modal.classList.remove('hidden');
                modal.classList.add('flex');

            } catch (e) {
                console.error('Failed to load history', e);
                alert('Failed to load task history. Please try again.');
            }
        }

        function hideHistoryModal() {
            const modal = document.getElementById('history-modal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        async function initializeDashboard() {
            formatHeaderDate();
            if ('{{ tab }}' === 'tasks') {
                await loadTasks();
                await loadProjects();
            }
            console.log('%c✅ Kaeru Dashboard updated successfully', 'color:#10b981; font-family:monospace');
        }


        // ====================== NOTES FUNCTIONALITY (Light Theme + Improved) ======================

let currentNotes = [];
let currentNoteId = null;
let autoSaveTimeout = null;

async function loadNotes() {
    try {
        const res = await fetch('/api/notes');
        currentNotes = await res.json();
        renderNotesList();
    } catch (e) {
        console.error('Failed to load notes', e);
    }
}

function renderNotesList() {
    const container = document.getElementById('notes-list');
    if (!container) return;
    
    let html = '';
    currentNotes.forEach(note => {
        const isActive = note.id === currentNoteId ? 'bg-white shadow-sm border border-gray-200' : 'hover:bg-white';
        html += `
            <div onclick="openNote(${note.id})" 
                 class="px-4 py-3.5 rounded-2xl cursor-pointer transition-all ${isActive}">
                <div class="font-medium text-gray-900 line-clamp-1">${note.title || 'Untitled Note'}</div>
                <div class="text-xs text-gray-500 mt-1">${new Date(note.updated_at).toLocaleDateString('en-US', {month:'short', day:'numeric'})}</div>
            </div>
        `;
    });
    
    container.innerHTML = html || `<div class="p-8 text-center text-gray-400">No notes yet.<br>Click + to create one</div>`;
}

async function createNewNote() {
    try {
        const res = await fetch('/api/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        const data = await res.json();
        await loadNotes();
        openNote(data.id);
    } catch (e) {
        alert('Failed to create note');
    }
}

async function openNote(id) {
    currentNoteId = id;
    renderNotesList();
    
    try {
        const res = await fetch(`/api/notes/${id}`);
        const note = await res.json();
        
        document.getElementById('note-title').value = note.title || 'Untitled Note';
        document.getElementById('note-editor').innerHTML = note.content || '<p></p>';
    } catch (e) {
        console.error(e);
    }
}

function autoSaveCurrentNote() {
    clearTimeout(autoSaveTimeout);
    autoSaveTimeout = setTimeout(saveCurrentNote, 800);
}

async function saveCurrentNote() {
    if (!currentNoteId) return;
    
    const title = document.getElementById('note-title').value.trim() || 'Untitled Note';
    const content = document.getElementById('note-editor').innerHTML;
    
    try {
        await fetch(`/api/notes/${currentNoteId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content })
        });
        await loadNotes();
    } catch (e) {
        console.error('Save failed', e);
    }
}

async function deleteCurrentNote() {
    if (!currentNoteId || !confirm('Delete this note permanently?')) return;
    
    try {
        await fetch(`/api/notes/${currentNoteId}`, { method: 'DELETE' });
        currentNoteId = null;
        await loadNotes();
        document.getElementById('note-title').value = '';
        document.getElementById('note-editor').innerHTML = '';
    } catch (e) {
        alert('Failed to delete note');
    }
}

// Toolbar Functions
function execCommand(command) {
    const editor = document.getElementById('note-editor');
    editor.focus();
    document.execCommand(command, false, null);
}

function setHeading(level) {
    const editor = document.getElementById('note-editor');
    editor.focus();
    if (level === 'h1') document.execCommand('formatBlock', false, 'h1');
    else if (level === 'h2') document.execCommand('formatBlock', false, 'h2');
    else if (level === 'h3') document.execCommand('formatBlock', false, 'h3');
    else document.execCommand('formatBlock', false, 'p');
}

function setColor(color) {
    const editor = document.getElementById('note-editor');
    editor.focus();
    document.execCommand('foreColor', false, color);
}

function insertLink() {
    const url = prompt("Enter the URL:", "https://");
    if (url && url !== "https://") {
        const editor = document.getElementById('note-editor');
        editor.focus();
        document.execCommand('createLink', false, url);
    }
}

function insertCodeBlock() {
    const code = prompt("Paste or type your code here:");
    if (code) {
        const editor = document.getElementById('note-editor');
        editor.focus();
        const html = `<pre style="background:#f8fafc; padding:14px; border-radius:10px; border:1px solid #e5e7eb; overflow:auto; font-family:monospace;"><code>${code.replace(/</g, '&lt;')}</code></pre>`;
        document.execCommand('insertHTML', false, html);
    }
}

// Initialize when Notes tab is active
if ('{{ tab }}' === 'notes') {
    window.addEventListener('load', loadNotes);
}
